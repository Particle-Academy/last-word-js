name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: CI only reads the repo (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PHP is REQUIRED, not optional. tests/parity.test.ts is the cross-engine
      # writer guarantee, and it throws in CI when php is absent rather than
      # skipping — because a skip here is a green build with zero parity
      # coverage, which is exactly how the holy-sheet and dark-slide suites
      # reported success over nothing for months.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, zip

      - name: Check out the PHP last-word
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/last-word
          path: .php-last-word

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # The parity helper autoloads the PHP sources from here. Without it
          # the helper falls back to ../../last-word/src, which only resolves
          # inside the .agi envelope — so outside it the suite would find no
          # classes at all.
          LAST_WORD_PHP_SRC: ${{ github.workspace }}/.php-last-word/src

      - name: Build
        run: npm run build
